<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#060b12;color:#c3d0e0;font-family:'Segoe UI','Microsoft JhengHei',sans-serif;padding:18px}
  h1{font-size:15px;margin:0 0 4px;color:#e6eefc;font-weight:700}
  p.sub{font-size:11px;color:#7d8fae;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{border:1px solid #22304a;border-radius:8px;overflow:hidden;background:#0b1220}
  .card img{display:block;width:100%;height:auto}
  .cap{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:11.5px}
  .cap b{color:#dbe6f5}
  .cap span{font-family:Consolas,monospace;font-size:10px;color:#7d8fae}
</style></head><body>
<h1>科技風格 · 四個設計方向</h1>
<p class="sub">同一份版面，只改設計代幣（顏色／圓角／陰影／密度／動效）——差異即規格差異。</p>
<div class="grid">
  <div class="card"><img src="variant-a.png"><div class="cap"><b>A · 終端機 / Data-Ops</b><span>#05070C · r2 · 無陰影 · 34px</span></div></div>
  <div class="card"><img src="variant-b.png"><div class="cap"><b>B · 全像霓虹</b><span>#070A18 · r12 · 外光 · 42px</span></div></div>
  <div class="card"><img src="variant-c.png"><div class="cap"><b>C · 瑞士企業（淺色）</b><span>#F5F7FB · r8 · 柔陰影 · 46px</span></div></div>
  <div class="card"><img src="variant-d.png"><div class="cap"><b>D · 控制室（建議）</b><span>#0B1220 · r4 · 內陰影 · 34px</span></div></div>
</div>
</body></html>
