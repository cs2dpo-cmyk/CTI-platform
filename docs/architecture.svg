<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="'Segoe UI','Microsoft JhengHei',sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2739"/></pattern></defs>
<rect width="100%" height="100%" fill="#060b12"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<text x="30" y="24" fill="#7e8da4" font-size="12" letter-spacing="1.5">CTI 資安風險決策支援平台 · 資料流（左＝產出／右＝輸入）</text>
<path d="M 595 122 L 595 140" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 595 204 L 595 222" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 595 298 L 595 316" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 595 392 L 595 410" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 595 490 L 595 508" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 595 600 L 595 618" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 870 354 L 810 354" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 870 554 L 810 554" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 380 354 L 330 354" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 380 450 L 330 450" fill="none" stroke="#5b6b82" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380" y="30" width="430" height="92" rx="12" fill="#0b2a5b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="396" y="56" fill="#dbeafe" font-size="14" font-weight="700">① 新聞來源</text>
<text x="396" y="78" fill="#c3d0e0" font-size="11.5">The Hacker News（國際，每月約 250 篇）</text>
<text x="396" y="94" fill="#c3d0e0" font-size="11.5">TWCERT / CC（台灣政府，每月約 5 篇）</text>
<text x="396" y="110" fill="#c3d0e0" font-size="11.5">iThome（台灣媒體，深頁 403 限制）</text>
<rect x="380" y="140" width="430" height="64" rx="12" fill="#0d3320" stroke="#22c55e" stroke-width="1.5"/>
<text x="396" y="166" fill="#dcfce7" font-size="14" font-weight="700">② 分層擷取</text>
<text x="396" y="188" fill="#c3d0e0" font-size="11.5">每月固定 15 篇國際＋5 篇台灣，鋪滿 35 個月</text>
<rect x="380" y="222" width="430" height="76" rx="12" fill="#0d3320" stroke="#22c55e" stroke-width="1.5"/>
<text x="396" y="248" fill="#dcfce7" font-size="14" font-weight="700">③ 語料庫（SQLite）</text>
<text x="396" y="270" fill="#c3d0e0" font-size="11.5">788 篇文章 → 去重後 741 件事件</text>
<text x="396" y="286" fill="#c3d0e0" font-size="11.5">抽出 288 個 CVE</text>
<rect x="380" y="316" width="430" height="76" rx="12" fill="#0d3320" stroke="#22c55e" stroke-width="1.5"/>
<text x="396" y="342" fill="#dcfce7" font-size="14" font-weight="700">④ 情資對照</text>
<text x="396" y="364" fill="#c3d0e0" font-size="11.5">CVE → EPSS／KEV／CVSS／CWE</text>
<text x="396" y="380" fill="#c3d0e0" font-size="11.5">同時標記「本地通報」（台灣來源）</text>
<rect x="380" y="410" width="430" height="80" rx="12" fill="#0d3320" stroke="#22c55e" stroke-width="1.5"/>
<text x="396" y="436" fill="#dcfce7" font-size="14" font-weight="700">⑤ 分類 ＋ 評分</text>
<text x="396" y="458" fill="#c3d0e0" font-size="11.5">規則分類 4 類（每篇附命中規則）</text>
<text x="396" y="474" fill="#c3d0e0" font-size="11.5">加權評分 50／30／12／8 → 0–100 分</text>
<rect x="380" y="508" width="430" height="92" rx="12" fill="#3b1d0b" stroke="#f97316" stroke-width="1.5"/>
<text x="396" y="534" fill="#ffedd5" font-size="14" font-weight="700">⑥ 修補優先級</text>
<text x="396" y="556" fill="#c3d0e0" font-size="11.5">KEV → P1｜EPSS≥10% 或 CVSS≥9 → P2</text>
<text x="396" y="572" fill="#c3d0e0" font-size="11.5">曝險升／降一級（KEV 不降）</text>
<text x="396" y="588" fill="#c3d0e0" font-size="11.5">P1 131｜P2 134｜P3 23＋SLA</text>
<rect x="380" y="618" width="430" height="86" rx="12" fill="#2a1252" stroke="#a855f7" stroke-width="1.5"/>
<text x="396" y="644" fill="#f3e8ff" font-size="14" font-weight="700">⑦ API ＋ 儀表板</text>
<text x="396" y="666" fill="#c3d0e0" font-size="11.5">FastAPI /api/v1（8 個端點）</text>
<text x="396" y="682" fill="#c3d0e0" font-size="11.5">4 分頁：總覽／修補／評估／情資</text>
<rect x="870" y="304" width="300" height="100" rx="12" fill="#0b3b36" stroke="#14b8a6" stroke-width="1.5"/>
<text x="886" y="330" fill="#ccfbf1" font-size="14" font-weight="700">外部官方快照</text>
<text x="886" y="352" fill="#c3d0e0" font-size="11.5">EPSS 911（利用機率）</text>
<text x="886" y="368" fill="#c3d0e0" font-size="11.5">KEV 1,779（已遭利用）</text>
<text x="886" y="384" fill="#c3d0e0" font-size="11.5">CVSS 704｜CWE 287</text>
<rect x="870" y="514" width="300" height="80" rx="12" fill="#0b3b36" stroke="#14b8a6" stroke-width="1.5"/>
<text x="886" y="540" fill="#ccfbf1" font-size="14" font-weight="700">企業資產清單</text>
<text x="886" y="562" fill="#c3d0e0" font-size="11.5">14 台示範資產</text>
<text x="886" y="578" fill="#c3d0e0" font-size="11.5">判斷是否對外曝險</text>
<rect x="30" y="316" width="300" height="76" rx="12" fill="#3b1d0b" stroke="#f97316" stroke-width="1.5"/>
<text x="46" y="342" fill="#ffedd5" font-size="14" font-weight="700">覆蓋缺口</text>
<text x="46" y="364" fill="#c3d0e0" font-size="11.5">KEV 窗內 711 筆</text>
<text x="46" y="380" fill="#c3d0e0" font-size="11.5">語料只涵蓋 80 筆（11%）</text>
<rect x="30" y="412" width="300" height="76" rx="12" fill="#3b1d0b" stroke="#f97316" stroke-width="1.5"/>
<text x="46" y="438" fill="#ffedd5" font-size="14" font-weight="700">即時評估</text>
<text x="46" y="460" fill="#c3d0e0" font-size="11.5">輸入資產情境 → 分數、劇本</text>
<text x="46" y="476" fill="#c3d0e0" font-size="11.5">what-if：怎麼降級</text>
</svg>
