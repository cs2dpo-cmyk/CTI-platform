<g>
  <rect x="40" y="40" width="210" height="72" rx="12" fill="#0b2a5b" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="56" y="66" fill="#dbeafe" font-size="14" font-weight="700">The Hacker News</text>
  <text x="56" y="88" fill="#cbd5e1" font-size="11.5">國際媒體</text>
  <text x="56" y="105" fill="#cbd5e1" font-size="11.5">每月約 250 篇</text>
</g>
<g>
  <rect x="270" y="40" width="210" height="72" rx="12" fill="#0b2a5b" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="286" y="66" fill="#dbeafe" font-size="14" font-weight="700">TWCERT / CC</text>
  <text x="286" y="88" fill="#cbd5e1" font-size="11.5">台灣政府 CERT</text>
  <text x="286" y="105" fill="#cbd5e1" font-size="11.5">每月約 5 篇</text>
</g>
<g>
  <rect x="500" y="40" width="210" height="72" rx="12" fill="#0b2a5b" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="516" y="66" fill="#dbeafe" font-size="14" font-weight="700">iThome</text>
  <text x="516" y="88" fill="#cbd5e1" font-size="11.5">台灣科技媒體</text>
  <text x="516" y="105" fill="#cbd5e1" font-size="11.5">深頁 403 限制</text>
</g>
<g>
  <rect x="760" y="30" width="300" height="130" rx="12" fill="#0b3b36" stroke="#14b8a6" stroke-width="1.4"/>
  <text x="776" y="56" fill="#ccfbf1" font-size="14" font-weight="700">外部官方快照</text>
  <text x="776" y="78" fill="#cbd5e1" font-size="11.5">EPSS 911 筆（利用機率）</text>
  <text x="776" y="95" fill="#cbd5e1" font-size="11.5">KEV 1,779 筆（已遭利用）</text>
  <text x="776" y="112" fill="#cbd5e1" font-size="11.5">CVSS 704 筆（嚴重度）</text>
  <text x="776" y="129" fill="#cbd5e1" font-size="11.5">CWE 287 筆（弱點類型）</text>
</g>
<g>
  <rect x="40" y="170" width="670" height="72" rx="12" fill="#0d3320" stroke="#22c55e" stroke-width="1.4"/>
  <text x="56" y="196" fill="#dcfce7" font-size="14" font-weight="700">分層擷取</text>
  <text x="56" y="218" fill="#cbd5e1" font-size="11.5">每月固定 15 篇國際 + 5 篇台灣，鋪滿 35 個月</text>
  <text x="56" y="235" fill="#cbd5e1" font-size="11.5">（避免語料被最近兩個月塞滿）</text>
</g>
<g>
  <rect x="40" y="290" width="670" height="72" rx="12" fill="#0d3320" stroke="#22c55e" stroke-width="1.4"/>
  <text x="56" y="316" fill="#dcfce7" font-size="14" font-weight="700">語料庫（SQLite）</text>
  <text x="56" y="338" fill="#cbd5e1" font-size="11.5">788 篇文章 → 去重後 741 件事件</text>
  <text x="56" y="355" fill="#cbd5e1" font-size="11.5">抽出 288 個 CVE</text>
</g>
<g>
  <rect x="760" y="290" width="300" height="72" rx="12" fill="#0b3b36" stroke="#14b8a6" stroke-width="1.4"/>
  <text x="776" y="316" fill="#ccfbf1" font-size="14" font-weight="700">企業資產清單</text>
  <text x="776" y="338" fill="#cbd5e1" font-size="11.5">14 台示範資產</text>
  <text x="776" y="355" fill="#cbd5e1" font-size="11.5">判斷是否對外曝險</text>
</g>
<g>
  <rect x="40" y="410" width="310" height="88" rx="12" fill="#0d3320" stroke="#22c55e" stroke-width="1.4"/>
  <text x="56" y="436" fill="#dcfce7" font-size="14" font-weight="700">規則分類（4 類）</text>
  <text x="56" y="458" fill="#cbd5e1" font-size="11.5">漏洞／惡意／研究／產業</text>
  <text x="56" y="475" fill="#cbd5e1" font-size="11.5">每篇附命中規則，可稽核</text>
</g>
<g>
  <rect x="380" y="410" width="310" height="88" rx="12" fill="#0d3320" stroke="#22c55e" stroke-width="1.4"/>
  <text x="396" y="436" fill="#dcfce7" font-size="14" font-weight="700">情資對照</text>
  <text x="396" y="458" fill="#cbd5e1" font-size="11.5">CVE → EPSS/KEV/CVSS/CWE</text>
  <text x="396" y="475" fill="#cbd5e1" font-size="11.5">本地通報（台灣來源）</text>
</g>
<g>
  <rect x="40" y="540" width="310" height="96" rx="12" fill="#0d3320" stroke="#22c55e" stroke-width="1.4"/>
  <text x="56" y="566" fill="#dcfce7" font-size="14" font-weight="700">可解釋評分（5 因子）</text>
  <text x="56" y="588" fill="#cbd5e1" font-size="11.5">嚴重度 50%｜利用 30%</text>
  <text x="56" y="605" fill="#cbd5e1" font-size="11.5">曝險 12%｜具名 8%</text>
  <text x="56" y="622" fill="#cbd5e1" font-size="11.5">→ 0–100 分</text>
</g>
<g>
  <rect x="380" y="540" width="310" height="96" rx="12" fill="#3b1d0b" stroke="#f97316" stroke-width="1.4"/>
  <text x="396" y="566" fill="#ffedd5" font-size="14" font-weight="700">修補優先級</text>
  <text x="396" y="588" fill="#cbd5e1" font-size="11.5">KEV→P1｜EPSS≥10% 或 CVSS≥9→P2</text>
  <text x="396" y="605" fill="#cbd5e1" font-size="11.5">曝險升/降一級（KEV 不降）</text>
  <text x="396" y="622" fill="#cbd5e1" font-size="11.5">P1 131｜P2 134｜P3 23</text>
</g>
<g>
  <rect x="720" y="540" width="340" height="96" rx="12" fill="#3b1d0b" stroke="#f97316" stroke-width="1.4"/>
  <text x="736" y="566" fill="#ffedd5" font-size="14" font-weight="700">覆蓋缺口</text>
  <text x="736" y="588" fill="#cbd5e1" font-size="11.5">KEV 窗內 711 筆中</text>
  <text x="736" y="605" fill="#cbd5e1" font-size="11.5">語料只涵蓋 80 筆（11%）</text>
  <text x="736" y="622" fill="#cbd5e1" font-size="11.5">→ 631 筆未收錄清單</text>
</g>
<g>
  <rect x="40" y="680" width="655" height="80" rx="12" fill="#3b1d0b" stroke="#f97316" stroke-width="1.4"/>
  <text x="56" y="706" fill="#ffedd5" font-size="14" font-weight="700">即時評估（單一情境）</text>
  <text x="56" y="728" fill="#cbd5e1" font-size="11.5">輸入資產、曝險、控制項 → 分數、等級、處置劇本</text>
  <text x="56" y="745" fill="#cbd5e1" font-size="11.5">what-if：加哪一項控制可降級</text>
</g>
<g>
  <rect x="40" y="800" width="1020" height="62" rx="12" fill="#2a1252" stroke="#a855f7" stroke-width="1.4"/>
  <text x="56" y="826" fill="#f3e8ff" font-size="14" font-weight="700">FastAPI /api/v1（8 個端點）</text>
  <text x="56" y="848" fill="#cbd5e1" font-size="11.5">/stats｜/threats｜/patch-priority｜/kev-uncovered｜/cve/{id}｜/assess</text>
</g>
<g>
  <rect x="40" y="900" width="1020" height="72" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="1.4"/>
  <text x="56" y="926" fill="#e2e8f0" font-size="14" font-weight="700">儀表板（4 個分頁）</text>
  <text x="56" y="948" fill="#cbd5e1" font-size="11.5">總覽｜修補清單（含弱點類型篩選）｜即時評估｜情資流</text>
</g>
</svg>
